services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reachset
      POSTGRES_PASSWORD: reachset
      POSTGRES_DB: reachset
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reachset"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  vault:
    image: hashicorp/vault:1.17
    # Dev mode only. The root token is the well-known dev default, not a secret:
    # it grants access to an empty in-memory Vault that dies with the container.
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: reachset-dev-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8220:8200"
    volumes:
      - vault-audit:/vault/logs
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 2s
      retries: 20

  api:
    build: .
    command: uvicorn reachset.api.app:app --host 0.0.0.0 --port 8000
    environment:
      REACHSET_DATABASE_URL: postgresql+asyncpg://reachset:reachset@postgres:5432/reachset
      REACHSET_REDIS_URL: redis://redis:6379/0
      REACHSET_VAULT_ADDR: http://vault:8200
      REACHSET_VAULT_TOKEN: reachset-dev-root
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python -m reachset.ingest.worker
    environment:
      REACHSET_DATABASE_URL: postgresql+asyncpg://reachset:reachset@postgres:5432/reachset
      REACHSET_REDIS_URL: redis://redis:6379/0
      REACHSET_VAULT_ADDR: http://vault:8200
      REACHSET_VAULT_TOKEN: reachset-dev-root
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  vault-audit:
