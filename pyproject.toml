[project]
name = "reachset"
version = "0.1.0"
description = "Effective reachability sets for human and non-human identities across SaaS apps"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Sheehan Lloyd" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "structlog>=24.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "rapidfuzz>=3.9",
    "mcp>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "testcontainers[postgres,redis]>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[project.scripts]
reachset = "reachset.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachset"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = [
    "SIM108", # ternary is not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF001", "RUF002"] # fixtures deliberately contain confusable unicode

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["reachset"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# testcontainers and rapidfuzz ship without type stubs
module = ["testcontainers.*", "rapidfuzz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Function-scoped loops everywhere: async engines/clients are function-scoped
# fixtures, so connections always belong to the running test's loop.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs Postgres/Redis/Vault (testcontainers or CI services)",
    "live_vault: exercises a real Vault dev server over HTTP",
    "bench: slow benchmark-support tests",
]
filterwarnings = [
    "error::RuntimeWarning",
]

[tool.coverage.run]
source = ["src/reachset"]
branch = true
# SQLAlchemy's async layer switches through greenlets and FastAPI resolves
# dependencies via anyio worker threads; without these, code that genuinely
# ran reports as uncovered.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
# The suite covers 100% of lines and branches on a typical run. The gate sits
# one point lower on purpose: the reachability property test generates a fresh
# random graph set on every run, and roughly one run in ten leaves a single
# data-dependent branch unexercised. Pinning Hypothesis to a fixed seed would
# make the gate exact but would also stop it exploring new graphs, which is the
# entire point of that test. A CI gate that fails at random is worse than one
# with a hair of slack, so the randomness stays and the floor gives way.
# Anything genuinely unexecutable carries a pragma with a reason instead.
fail_under = 99
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
